[Unit]
# Ensure health-checker waits for piccolod to be ready.
# This avoids false positives during boot if piccolod is slow to start.
After=piccolod.service

# A failed checker must not strand a headless appliance in emergency mode.
# The non-force action preserves an intentional shutdown already in progress;
# reboot.target owns the bounded force fallback if normal shutdown stalls.
FailureAction=reboot

[Service]
# Bound checker and plugin hangs before they can leave boot validation pending.
TimeoutStartSec=5min
